    <rect x="24" y="65" width="652" height="90" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <rect x="24" y="65" width="6" height="90" rx="3" fill="#3b82f6" />
    <text x="45" y="95" fill="#0f172a" font-family="Arial, sans-serif" font-weight="bold" font-size="14">Jam 07:30 - 09:30 | Pemrograman Web &amp; Perangkat Bergerak</text>
    <text x="45" y="120" fill="#64748b" font-family="Arial, sans-serif" font-size="12">Kelas: XII RPL 1 • Ruang Lab Komputer 1 • 36 Siswa (30 Hadir, 5 PKL)</text>
    <rect x="560" y="90" width="95" height="28" rx="6" fill="#dbeafe" />
    <text x="607" y="108" fill="#1e40af" font-family="Arial, sans-serif" font-weight="bold" font-size="11" text-anchor="middle">BERJALAN</text>

    <!-- Item 2 -->
    <rect x="24" y="170" width="652" height="90" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <rect x="24" y="170" width="6" height="90" rx="3" fill="#10b981" />
    <text x="45" y="200" fill="#0f172a" font-family="Arial, sans-serif" font-weight="bold" font-size="14">Jam 10:00 - 12:00 | Basis Data &amp; SQL Query</text>
    <text x="45" y="225" fill="#64748b" font-family="Arial, sans-serif" font-size="12">Kelas: XI RPL 2 • Ruang Teori 4 • 34 Siswa Terdaftar</text>
    <rect x="560" y="195" width="95" height="28" rx="6" fill="#f1f5f9" />
    <text x="607" y="213" fill="#64748b" font-family="Arial, sans-serif" font-weight="bold" font-size="11" text-anchor="middle">BERIKUTNYA</text>

    <!-- Supervisi Card -->
    <rect x="730" y="0" width="380" height="590" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="754" y="36" fill="#0f172a" font-family="Arial, sans-serif" font-weight="bold" font-size="16">Catatan Pembinaan Kepala Sekolah</text>
    
    <rect x="754" y="65" width="332" height="150" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1" />
    <text x="770" y="95" fill="#92400e" font-family="Arial, sans-serif" font-weight="bold" font-size="13">📌 Catatan Supervisi Semester Ganjil</text>
    <text x="770" y="120" fill="#78350f" font-family="Arial, sans-serif" font-size="12">"Perangkat ajar dan modul PKL RPL telah</text>
    <text x="770" y="140" fill="#78350f" font-family="Arial, sans-serif" font-size="12">disetujui. Mohon pantau absensi mandiri</text>
    <text x="770" y="160" fill="#78350f" font-family="Arial, sans-serif" font-size="12">siswa di PT Telkom secara berkala."</text>
    <text x="770" y="190" fill="#92400e" font-family="Arial, sans-serif" font-size="11">— Drs. H. Ahmad Sanusi, M.Pd (Kepala Sekolah)</text>
  </g>
</svg>