<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <!-- iPhone 15 frame -->
  <rect width="390" height="844" rx="40" fill="#f8fafc" stroke="#163300" stroke-width="4" />

  <!-- Status Bar -->
  <rect x="0" y="0" width="390" height="44" rx="40" fill="#163300" />
  <rect x="0" y="24" width="390" height="20" fill="#163300" />
  <text x="32" y="30" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="13">07:15</text>
  <text x="325" y="30" fill="#ffffff" font-family="Arial, sans-serif" font-size="11">📶 5G 100%</text>

  <!-- App Header -->
  <rect x="0" y="44" width="390" height="56" fill="#163300" />
  <text x="20" y="78" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="16">Presensi Mandiri PKL</text>
  <rect x="260" y="60" width="110" height="24" rx="12" fill="#285804" />
  <circle cx="272" cy="72" r="3.5" fill="#9fe870" />
  <text x="320" y="76" fill="#9fe870" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="10" text-anchor="middle">HARI AKTIF DUDI</text>

  <!-- DUDI Card Info -->
  <g transform="translate(16, 112)">
    <rect x="0" y="0" width="358" height="80" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="18" y="26" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">LOKASI PENEMPATAN MAGANG (DUDI)</text>
    <text x="18" y="48" fill="#163300" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="15">PT Telkom Akses Cirebon</text>
    <text x="18" y="66" fill="#475569" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Jl. Pagongan No. 12 • Jam Operasional: 07:30 - 16:30 WIB</text>
  </g>

  <!-- Live WebRTC Camera Viewfinder -->
  <g transform="translate(16, 204)">
    <rect x="0" y="0" width="358" height="280" rx="16" fill="#0f172a" stroke="#163300" stroke-width="2" />
    
    <!-- Face Oval Guide -->
    <ellipse cx="179" cy="135" rx="75" ry="95" fill="none" stroke="#9fe870" stroke-width="2" stroke-dasharray="6,4" />
    <circle cx="179" cy="120" r="28" fill="#1e293b" opacity="0.6" />
    <text x="179" y="126" fill="#94a3b8" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">👤</text>
    <text x="179" y="215" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" text-anchor="middle">Posisikan wajah di dalam bingkai oval</text>

    <!-- Top Left Live Badge -->
    <rect x="14" y="14" width="135" height="24" rx="6" fill="#163300" opacity="0.9" />
    <circle cx="26" cy="26" r="3.5" fill="#ef4444" />
    <text x="78" y="30" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="9" text-anchor="middle">LIVE WebRTC CAMERA</text>
  </g>

  <!-- GPS Geofence Radar Card -->
  <g transform="translate(16, 496)">
    <rect x="0" y="0" width="358" height="115" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <circle cx="36" cy="36" r="18" fill="#e2f6d5" />
    <text x="36" y="42" fill="#163300" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">📍</text>
    <text x="65" y="30" fill="#163300" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="13">Verifikasi Geofencing Haversine</text>
    <text x="65" y="48" fill="#475569" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Jarak ke titik DUDI: <tspan fill="#16a34a" font-weight="bold">18 meter</tspan> (Radius: 50m)</text>

    <!-- Success Badge -->
    <rect x="18" y="70" width="322" height="30" rx="6" fill="#e2f6d5" />
    <text x="179" y="90" fill="#163300" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="11" text-anchor="middle">✓ KOORDINAT GPS VALID DI DALAM RADIUS DUDI</text>
  </g>

  <!-- Submit Button (Electric Lime #9fe870) -->
  <g transform="translate(16, 625)">
    <rect x="0" y="0" width="358" height="52" rx="26" fill="#9fe870" stroke="#163300" stroke-width="1" />
    <text x="179" y="32" fill="#163300" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="14" text-anchor="middle">📸 Ambil Swafoto &amp; Kirim Presensi</text>
  </g>

  <!-- Riwayat Button -->
  <g transform="translate(16, 688)">
    <rect x="0" y="0" width="358" height="44" rx="22" fill="#ffffff" stroke="#163300" stroke-width="1.5" />
    <text x="179" y="27" fill="#163300" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Lihat Riwayat Presensi PKL</text>
  </g>

  <!-- Home Indicator Bar -->
  <rect x="135" y="826" width="120" height="5" rx="2.5" fill="#94a3b8" />
</svg>