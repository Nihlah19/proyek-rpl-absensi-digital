<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <linearGradient id="camGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Mobile Frame Background -->
  <rect width="390" height="844" rx="40" fill="#0f172a" />

  <!-- Mobile Status Bar -->
  <text x="32" y="34" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="14">07:15</text>
  <text x="320" y="34" fill="#ffffff" font-family="Arial, sans-serif" font-size="12">5G 📶 100%</text>

  <!-- App Header -->
  <rect x="0" y="50" width="390" height="60" fill="#1e293b" />
  <text x="24" y="86" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="16">Presensi Mandiri PKL</text>
  <rect x="270" y="68" width="96" height="24" rx="12" fill="#065f46" />
  <text x="318" y="84" fill="#6ee7b7" font-family="Arial, sans-serif" font-weight="bold" font-size="10" text-anchor="middle">● HARI AKTIF</text>

  <!-- DUDI Card Info -->
  <rect x="20" y="125" width="350" height="85" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="36" y="150" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11">Tempat Penugasan Magang (DUDI):</text>
  <text x="36" y="172" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="15">PT Telkom Akses Cirebon</text>
  <text x="36" y="192" fill="#38bdf8" font-family="Arial, sans-serif" font-size="11">Jl. Pagongan No. 12 • Jam Kerja: 07:30 - 16:30</text>

  <!-- Live Camera Viewfinder Box -->
  <rect x="20" y="225" width="350" height="300" rx="16" fill="url(#camGrad)" stroke="#3b82f6" stroke-width="2" />
  
  <!-- Viewfinder Overlay Elements -->
  <!-- Target Face Outline -->
  <ellipse cx="195" cy="360" rx="80" ry="105" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4" />
  <circle cx="195" cy="340" r="30" fill="#334155" opacity="0.6" />
  <text x="195" y="346" fill="#94a3b8" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">👤</text>
  <text x="195" y="445" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Posisikan wajah di dalam bingkai</text>

  <!-- Top Viewfinder Badge -->
  <rect x="36" y="240" width="130" height="26" rx="13" fill="#0f172a" opacity="0.8" />
  <circle cx="50" cy="253" r="4" fill="#ef4444" />
  <text x="62" y="257" fill="#ffffff" font-family="Arial, sans-serif" font-size="10">LIVE WebRTC CAM</text>

  <!-- GPS Geofence Radar Card -->
  <rect x="20" y="540" width="350" height="120" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <circle cx="50" cy="575" r="18" fill="#065f46" />
  <text x="50" y="581" fill="#34d399" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">📍</text>
  <text x="80" y="568" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="14">Verifikasi Titik Geofencing</text>
  
  <text x="80" y="590" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">Jarak saat ini: <tspan fill="#4ade80" font-weight="bold">18 meter</tspan> dari kantor DUDI</text>
  <text x="80" y="608" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11">Radius toleransi maksimal: 50 meter</text>

  <rect x="36" y="625" width="318" height="24" rx="6" fill="#065f46" />
  <text x="195" y="641" fill="#a7f3d0" font-family="Arial, sans-serif" font-weight="bold" font-size="11" text-anchor="middle">✓ LOKASI VALID DI DALAM RADIUS DUDI</text>

  <!-- Submit Action Button -->
  <rect x="20" y="675" width="350" height="52" rx="14" fill="#4f46e5" />
  <text x="195" y="707" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="15" text-anchor="middle">📸 Ambil Swafoto &amp; Kirim Presensi</text>

  <!-- Riwayat Button -->
  <rect x="20" y="740" width="350" height="44" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <text x="195" y="767" fill="#cbd5e1" font-family="Arial, sans-serif" font-weight="bold" font-size="13" text-anchor="middle">Lihat Riwayat Presensi PKL</text>

  <!-- Home Indicator -->
  <rect x="135" y="830" width="120" height="5" rx="2.5" fill="#475569" />
</svg>