<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Paper -->
  <rect width="1440" height="900" fill="#ffffff" />

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- TOP NAVIGATION BAR (64px, White, Fog Border, Pill Switcher)    -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <rect x="0" y="0" width="1440" height="64" fill="#ffffff" />
  <line x1="0" y1="64" x2="1440" y2="64" stroke="#e8ebe6" stroke-width="1" />

  <!-- Brand / Logo -->
  <circle cx="100" cy="32" r="18" fill="#163300" />
  <text x="100" y="38" fill="#9fe870" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-weight="900" font-size="16" text-anchor="middle">NU</text>
  <text x="130" y="37" fill="#0e0f0c" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-weight="900" font-size="14" letter-spacing="0.5">SMK NU WARGABINANGUN</text>

  <!-- Segmented Tab Nav Switcher (Wise Signature Pill Nav) -->
  <rect x="520" y="14" width="400" height="36" rx="18" fill="#e8ebe6" />
  <!-- Active Tab: Beranda -->
  <rect x="523" y="17" width="85" height="30" rx="15" fill="#9fe870" />
  <text x="565" y="36" fill="#163300" font-family="Inter, sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Beranda</text>
  <text x="660" y="36" fill="#454745" font-family="Inter, sans-serif" font-weight="600" font-size="12">Fitur Presensi</text>
  <text x="765" y="36" fill="#454745" font-family="Inter, sans-serif" font-weight="600" font-size="12">Alur Sistem</text>
  <text x="850" y="36" fill="#454745" font-family="Inter, sans-serif" font-weight="600" font-size="12">Peran Pengguna</text>

  <!-- Right Action: Masuk Portal Pill -->
  <rect x="1270" y="14" width="130" height="36" rx="18" fill="#ffffff" stroke="#163300" stroke-width="1.5" />
  <text x="1335" y="37" fill="#163300" font-family="Inter, sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Masuk Portal →</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- HERO SECTION                                                    -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- Left Hero Content (7 Cols) -->
  <g transform="translate(80, 115)">
    <!-- Wise Headline Shout (Ultra-heavy 900) -->
    <text x="0" y="65" fill="#0e0f0c" font-family="Inter, sans-serif" font-weight="900" font-size="56" letter-spacing="-2">PRESENSI GERBANG</text>
    <text x="0" y="130" fill="#0e0f0c" font-family="Inter, sans-serif" font-weight="900" font-size="56" letter-spacing="-2">SECEPAT KEDIPAN</text>
    <text x="0" y="195" fill="#163300" font-family="Inter, sans-serif" font-weight="900" font-size="56" letter-spacing="-2">MATA.</text>

    <!-- Body Copy in Warm Charcoal -->
    <text x="0" y="245" fill="#454745" font-family="Inter, sans-serif" font-size="17">Menghubungkan gerbang sekolah, guru kelas, dan orang tua murid secara</text>
    <text x="0" y="272" fill="#454745" font-family="Inter, sans-serif" font-size="17">transparan. Tap kartu RFID siswa, scan QR Barcode guru, presensi</text>
    <text x="0" y="299" fill="#454745" font-family="Inter, sans-serif" font-size="17">mandiri magang PKL anti-fraud, serta pemberitahuan otomatis ke orang tua.</text>

    <!-- Action Group: Filled Lime CTA + Text Link Button -->
    <rect x="0" y="340" width="250" height="52" rx="26" fill="#9fe870" />
    <text x="125" y="372" fill="#163300" font-family="Inter, sans-serif" font-weight="bold" font-size="15" text-anchor="middle">Masuk ke Portal Presensi →</text>
    
    <text x="285" y="372" fill="#163300" font-family="Inter, sans-serif" font-weight="bold" font-size="15" text-decoration="underline">Pelajari Fitur Sistem ↓</text>

    <!-- Benefits Checklist -->
    <line x1="0" y1="435" x2="680" y2="435" stroke="#e8ebe6" stroke-width="1" />
    <g transform="translate(0, 460)" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#163300">
      <circle cx="8" cy="6" r="7" fill="#e2f6d5" />
      <text x="8" y="10" fill="#163300" font-size="9" text-anchor="middle">✓</text>
      <text x="22" y="10">Notifikasi Otomatis Orang Tua</text>

      <circle cx="218" cy="6" r="7" fill="#e2f6d5" />
      <text x="218" y="10" fill="#163300" font-size="9" text-anchor="middle">✓</text>
      <text x="232" y="10">Kartu Fisik &amp; QR Siswa</text>

      <circle cx="400" cy="6" r="7" fill="#e2f6d5" />
      <text x="400" y="10" fill="#163300" font-size="9" text-anchor="middle">✓</text>
      <text x="414" y="10">Rekap Real-time</text>

      <circle cx="540" cy="6" r="7" fill="#e2f6d5" />
      <text x="540" y="10" fill="#163300" font-size="9" text-anchor="middle">✓</text>
      <text x="554" y="10">Geofence PKL</text>
    </g>
  </g>

  <!-- Right Hero Simulator Widget (Wise Style Dual Surface 28px card) -->
  <g transform="translate(850, 105)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="510" height="490" rx="28" fill="#e8ebe6" stroke="#d5d9d2" stroke-width="1" />
    
    <!-- Simulator Top Header -->
    <text x="30" y="42" fill="#0e0f0c" font-family="Inter, sans-serif" font-weight="900" font-size="13" letter-spacing="1">SIMULASI PRESENSI</text>
    
    <rect x="365" y="24" width="115" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <circle cx="378" cy="37" r="4" fill="#10b981" />
    <text x="430" y="41" fill="#163300" font-family="Inter, sans-serif" font-weight="bold" font-size="11" text-anchor="middle">Sistem Aktif</text>

    <!-- Interactive Mode Tabs -->
    <rect x="30" y="65" width="450" height="38" rx="19" fill="#ffffff" />
    <!-- Tab 1: Kartu Siswa (Active Lime) -->
    <rect x="33" y="68" width="220" height="32" rx="16" fill="#9fe870" />
    <text x="143" y="88" fill="#163300" font-family="Inter, sans-serif" font-weight="bold" font-size="12" text-anchor="middle">💳 Kartu Siswa (RFID)</text>
    <text x="350" y="88" fill="#454745" font-family="Inter, sans-serif" font-weight="600" font-size="12" text-anchor="middle">📱 Kode QR Siswa</text>

    <!-- Simulated Card Screen Inner Box -->
    <rect x="30" y="125" width="450" height="330" rx="18" fill="#ffffff" stroke="#d5d9d2" stroke-width="1" />
    
    <!-- Card Brand & Chip -->
    <rect x="55" y="150" width="50" height="38" rx="6" fill="#fbbf24" stroke="#d97706" stroke-width="1" />
    <text x="120" y="165" fill="#0e0f0c" font-family="Inter, sans-serif" font-weight="900" font-size="15">SMK NU WARGABINANGUN</text>
    <text x="120" y="182" fill="#868685" font-family="Inter, sans-serif" font-size="11">KARTU PRESENSI PINTAR</text>

    <text x="55" y="225" fill="#868685" font-family="Inter, sans-serif" font-size="10">NOMOR INDUK SISWA (NIS)</text>
    <text x="55" y="248" fill="#0e0f0c" font-family="'JetBrains Mono', monospace" font-weight="bold" font-size="18">202410842</text>

    <text x="55" y="280" fill="#0e0f0c" font-family="Inter, sans-serif" font-weight="bold" font-size="16">AHMAD FAUZI</text>
    <text x="55" y="298" fill="#454745" font-family="Inter, sans-serif" font-size="12">Kelas XII Rekayasa Perangkat Lunak 1</text>

    <!-- Tap Confirmation Banner -->
    <rect x="55" y="325" width="400" height="52" rx="10" fill="#163300" />
    <circle cx="80" cy="351" r="12" fill="#9fe870" />
    <text x="80" y="356" fill="#163300" font-family="Inter, sans-serif" font-weight="bold" font-size="14" text-anchor="middle">✓</text>
    <text x="105" y="347" fill="#9fe870" font-family="Inter, sans-serif" font-weight="bold" font-size="13">TAP GERBANG BERHASIL</text>
    <text x="105" y="365" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11">06:42:15 WIB • Notifikasi terkirim ke Orang Tua</text>

    <!-- RFID Reader Sensor Wave Simulation -->
    <rect x="55" y="395" width="400" height="42" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
    <text x="75" y="420" fill="#15803d" font-family="Inter, sans-serif" font-weight="bold" font-size="11">● RC522 Hardware Gate 1: Latensi 0.12s (Optimal)</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- 4 FEATURES GRID SECTION (Wise Style Surfaces)                  -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <g transform="translate(80, 640)">
    <!-- Feature 1 -->
    <rect x="0" y="0" width="300" height="195" rx="16" fill="#f8fafc" stroke="#e8ebe6" stroke-width="1" />
    <rect x="24" y="24" width="44" height="44" rx="22" fill="#e2f6d5" />
    <text x="46" y="52" fill="#163300" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">💳</text>
    <text x="24" y="98" fill="#0e0f0c" font-family="Inter, sans-serif" font-weight="bold" font-size="16">Mesin RFID Gerbang</text>
    <text x="24" y="125" fill="#454745" font-family="Inter, sans-serif" font-size="13">Tap kartu pintar frekuensi</text>
    <text x="24" y="145" fill="#454745" font-family="Inter, sans-serif" font-size="13">13.56 MHz, bebas antrean &amp;</text>
    <text x="24" y="165" fill="#454745" font-family="Inter, sans-serif" font-size="13">terkoneksi langsung ke server.</text>

    <!-- Feature 2 -->
    <rect x="325" y="0" width="300" height="195" rx="16" fill="#f8fafc" stroke="#e8ebe6" stroke-width="1" />
    <rect x="349" y="24" width="44" height="44" rx="22" fill="#e2f6d5" />
    <text x="371" y="52" fill="#163300" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">📍</text>
    <text x="349" y="98" fill="#0e0f0c" font-family="Inter, sans-serif" font-weight="bold" font-size="16">Presensi Mandiri PKL</text>
    <text x="349" y="125" fill="#454745" font-family="Inter, sans-serif" font-size="13">Khusus magang industri DUDI.</text>
    <text x="349" y="145" fill="#454745" font-family="Inter, sans-serif" font-size="13">Kalkulasi Haversine GPS &amp;</text>
    <text x="349" y="165" fill="#454745" font-family="Inter, sans-serif" font-size="13">swafoto kamera langsung anti-fraud.</text>

    <!-- Feature 3 -->
    <rect x="650" y="0" width="300" height="195" rx="16" fill="#f8fafc" stroke="#e8ebe6" stroke-width="1" />
    <rect x="674" y="24" width="44" height="44" rx="22" fill="#e2f6d5" />
    <text x="696" y="52" fill="#163300" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">📱</text>
    <text x="674" y="98" fill="#0e0f0c" font-family="Inter, sans-serif" font-weight="bold" font-size="16">Telegram &amp; WhatsApp</text>
    <text x="674" y="125" fill="#454745" font-family="Inter, sans-serif" font-size="13">Notifikasi kehadiran siswa</text>
    <text x="674" y="145" fill="#454745" font-family="Inter, sans-serif" font-size="13">terkirim otomatis dan realtime</text>
    <text x="674" y="165" fill="#454745" font-family="Inter, sans-serif" font-size="13">ke bot grup wali kelas &amp; wali murid.</text>

    <!-- Feature 4 -->
    <rect x="975" y="0" width="300" height="195" rx="16" fill="#f8fafc" stroke="#e8ebe6" stroke-width="1" />
    <rect x="999" y="24" width="44" height="44" rx="22" fill="#e2f6d5" />
    <text x="1021" y="52" fill="#163300" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">🤖</text>
    <text x="999" y="98" fill="#0e0f0c" font-family="Inter, sans-serif" font-weight="bold" font-size="16">Asisten Cerdas AI</text>
    <text x="999" y="125" fill="#454745" font-family="Inter, sans-serif" font-size="13">Tanya jawab data kehadiran</text>
    <text x="999" y="145" fill="#454745" font-family="Inter, sans-serif" font-size="13">terintegrasi database sekolah,</text>
    <text x="999" y="165" fill="#454745" font-family="Inter, sans-serif" font-size="13">mematuhi SOP resmi sekolah.</text>
  </g>

  <!-- Bottom Footer Line -->
  <line x1="0" y1="860" x2="1440" y2="860" stroke="#e8ebe6" stroke-width="1" />
  <text x="80" y="885" fill="#868685" font-family="Inter, sans-serif" font-size="12">© 2026 SMK NU Wargabinangun • Sistem Absensi Terpadu IoT RFID &amp; PKL</text>
  <text x="1260" y="885" fill="#163300" font-family="Inter, sans-serif" font-weight="bold" font-size="12">Wise Design System</text>
</svg>