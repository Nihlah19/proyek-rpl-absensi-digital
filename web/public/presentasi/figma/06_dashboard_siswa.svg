<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <rect width="1440" height="900" fill="#f8fafc" />

  <!-- Sidebar -->
  <rect x="0" y="0" width="260" height="900" fill="#0f172a" />
  <rect x="24" y="24" width="36" height="36" rx="8" fill="#3b82f6" />
  <text x="42" y="48" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="18" text-anchor="middle">S</text>
  <text x="70" y="42" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="15">PORTAL SISWA</text>
  <text x="70" y="56" fill="#64748b" font-family="Arial, sans-serif" font-size="10">SMK NU WARGABINANGUN</text>

  <g font-family="Arial, sans-serif" font-size="13">
    <rect x="16" y="90" width="228" height="42" rx="8" fill="#1e293b" />
    <rect x="16" y="90" width="4" height="42" rx="2" fill="#38bdf8" />
    <text x="45" y="116" fill="#38bdf8" font-weight="bold">📊 Beranda Siswa</text>

    <text x="45" y="160" fill="#94a3b8">💳 Kartu Digital RFID</text>
    <text x="45" y="202" fill="#38bdf8" font-weight="bold">📍 Presensi Mandiri PKL</text>
    <text x="45" y="244" fill="#94a3b8">📈 Riwayat Kehadiran</text>
    <text x="45" y="286" fill="#94a3b8">📝 Pengajuan Izin/Sakit</text>
    <text x="45" y="328" fill="#94a3b8">💬 Catatan Wali Kelas</text>
  </g>

  <!-- Top Navbar -->
  <rect x="260" y="0" width="1180" height="70" fill="#ffffff" />
  <line x1="260" y1="70" x2="1440" y2="70" stroke="#e2e8f0" stroke-width="1" />
  <text x="290" y="42" fill="#0f172a" font-family="Arial, sans-serif" font-weight="bold" font-size="18">Dashboard Siswa &amp; Presensi Digital</text>

  <!-- Profile Badge -->
  <rect x="1160" y="14" width="240" height="42" rx="21" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <circle cx="1182" cy="35" r="14" fill="#3b82f6" />
  <text x="1182" y="40" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">MF</text>
  <text x="1205" y="32" fill="#0f172a" font-family="Arial, sans-serif" font-weight="bold" font-size="12">Muhammad Fauzan</text>
  <text x="1205" y="46" fill="#64748b" font-family="Arial, sans-serif" font-size="10">NIS: 202410842 • XII RPL 1</text>

  <!-- Digital ID Card Section -->
  <g transform="translate(290, 95)">
    <!-- Digital Card -->
    <rect x="0" y="0" width="460" height="260" rx="16" fill="#1e1b4b" stroke="#4f46e5" stroke-width="2" />
    <circle cx="400" cy="50" r="70" fill="#4f46e5" opacity="0.3" />
    <text x="35" y="45" fill="#38bdf8" font-family="Arial, sans-serif" font-weight="bold" font-size="13">KARTU TANDA PELAJAR DIGITAL (RFID)</text>
    <text x="35" y="70" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="20">SMK NU WARGABINANGUN</text>

    <!-- Chip Icon -->
    <rect x="35" y="95" width="45" height="35" rx="6" fill="#fbbf24" stroke="#d97706" stroke-width="1" />
    <text x="35" y="165" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11">UID KARTU RFID FISIK</text>
    <text x="35" y="185" fill="#ffffff" font-family="Courier, monospace" font-weight="bold" font-size="16">5A:8F:B3:9C:12</text>

    <text x="35" y="225" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="15">MUHAMMAD FAUZAN</text>
    <text x="35" y="242" fill="#a5b4fc" font-family="Arial, sans-serif" font-size="12">Kelas XII RPL 1 • Kompetensi Keahlian RPL</text>

    <rect x="340" y="195" width="95" height="34" rx="17" fill="#10b981" />
    <text x="387" y="217" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="11" text-anchor="middle">AKTIF ✓</text>

    <!-- Monthly Stats Summary -->
    <rect x="490" y="0" width="620" height="260" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="520" y="40" fill="#0f172a" font-family="Arial, sans-serif" font-weight="bold" font-size="16">Akumulasi Kehadiran Bulan Ini (November 2026)</text>
    
    <g transform="translate(520, 70)">
      <rect x="0" y="0" width="130" height="85" rx="8" fill="#ecfdf5" />
      <text x="15" y="28" fill="#065f46" font-family="Arial, sans-serif" font-size="12">Hadir</text>
      <text x="15" y="65" fill="#047857" font-family="Arial, sans-serif" font-weight="bold" font-size="28">22</text>

      <rect x="145" y="0" width="130" height="85" rx="8" fill="#e0f2fe" />
      <text x="160" y="28" fill="#075985" font-family="Arial, sans-serif" font-size="12">Presensi PKL</text>
      <text x="160" y="65" fill="#0284c7" font-family="Arial, sans-serif" font-weight="bold" font-size="28">18</text>

      <rect x="290" y="0" width="130" height="85" rx="8" fill="#fef3c7" />
      <text x="305" y="28" fill="#92400e" font-family="Arial, sans-serif" font-size="12">Izin / Sakit</text>
      <text x="305" y="65" fill="#b45309" font-family="Arial, sans-serif" font-weight="bold" font-size="28">1</text>

      <rect x="435" y="0" width="130" height="85" rx="8" fill="#fee2e2" />
      <text x="450" y="28" fill="#991b1b" font-family="Arial, sans-serif" font-size="12">Alfa</text>
      <text x="450" y="65" fill="#b91c1c" font-family="Arial, sans-serif" font-weight="bold" font-size="28">0</text>
    </g>

    <text x="520" y="195" fill="#64748b" font-family="Arial, sans-serif" font-size="13">Persentase Kehadiran Total Semester Ini: <tspan fill="#10b981" font-weight="bold">97.8%</tspan> (Sangat Baik)</text>
    <rect x="520" y="210" width="560" height="12" rx="6" fill="#e2e8f0" />
    <rect x="520" y="210" width="547" height="12" rx="6" fill="#10b981" />
  </g>

  <!-- PKL Action Banner -->
  <g transform="translate(290, 380)">
    <rect x="0" y="0" width="1110" height="100" rx="12" fill="#0284c7" />
    <text x="35" y="42" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="18">📍 Anda Sedang Ditugaskan Praktik Kerja Lapangan (PKL)</text>
    <text x="35" y="68" fill="#e0f2fe" font-family="Arial, sans-serif" font-size="13">Lokasi Penempatan: PT Telkom Akses Cirebon • Radius Toleransi Geofence: 50 Meter</text>
    <rect x="880" y="28" width="195" height="44" rx="8" fill="#ffffff" />
    <text x="977" y="55" fill="#0284c7" font-family="Arial, sans-serif" font-weight="bold" font-size="13" text-anchor="middle">Buka Presensi PKL →</text>
  </g>
</svg>