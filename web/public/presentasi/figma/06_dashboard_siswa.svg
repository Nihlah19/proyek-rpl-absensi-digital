<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <rect width="1440" height="900" fill="#f8fafc" />

  <!-- Sidebar -->
  <rect x="0" y="0" width="250" height="900" fill="#163300" />
  <circle cx="45" cy="40" r="18" fill="#9fe870" />
  <text x="45" y="46" fill="#163300" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="16" text-anchor="middle">NU</text>
  <text x="75" y="38" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13">PORTAL SISWA</text>
  <text x="75" y="52" fill="#9fe870" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">SMK NU WARGABINANGUN</text>

  <g transform="translate(14, 85)" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">
    <rect x="0" y="0" width="222" height="40" rx="8" fill="#285804" />
    <text x="38" y="25" fill="#9fe870" font-weight="bold">📊 Beranda Siswa</text>

    <text x="38" y="65" fill="#d1d5db">💳 Kartu Digital RFID</text>
    <text x="38" y="105" fill="#9fe870" font-weight="bold">📍 Presensi Mandiri PKL</text>
    <text x="38" y="145" fill="#d1d5db">📈 Riwayat Kehadiran</text>
    <text x="38" y="185" fill="#d1d5db">📝 Pengajuan Izin/Sakit</text>
    <text x="38" y="225" fill="#d1d5db">💬 Catatan Wali Kelas</text>
  </g>

  <!-- Top Navbar -->
  <rect x="250" y="0" width="1190" height="64" fill="#ffffff" />
  <line x1="250" y1="64" x2="1440" y2="64" stroke="#e2e8f0" stroke-width="1" />
  <text x="280" y="38" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="18">Portal Siswa &amp; Kartu RFID Pintar</text>

  <!-- Digital ID Card Section -->
  <g transform="translate(280, 85)">
    <!-- Digital Card (Wise Style Forest #163300) -->
    <rect x="0" y="0" width="460" height="260" rx="16" fill="#163300" stroke="#285804" stroke-width="2" />
    <circle cx="400" cy="50" r="70" fill="#285804" opacity="0.3" />
    <text x="35" y="45" fill="#9fe870" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="12">KARTU TANDA PELAJAR DIGITAL (RFID)</text>
    <text x="35" y="70" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="18">SMK NU WARGABINANGUN</text>

    <!-- Chip Icon -->
    <rect x="35" y="95" width="45" height="35" rx="6" fill="#fbbf24" stroke="#d97706" stroke-width="1" />
    <text x="35" y="165" fill="#9fe870" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">UID KARTU RFID FISIK</text>
    <text x="35" y="185" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-weight="bold" font-size="16">5A:8F:B3:9C:12</text>

    <text x="35" y="225" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="15">AHMAD FAUZI</text>
    <text x="35" y="242" fill="#d1d5db" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">NIS: 202410842 • Kelas XII RPL 1</text>

    <rect x="340" y="195" width="95" height="34" rx="17" fill="#9fe870" />
    <text x="387" y="217" fill="#163300" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="11" text-anchor="middle">AKTIF ✓</text>

    <!-- Monthly Stats Summary -->
    <rect x="490" y="0" width="630" height="260" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="520" y="40" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="16">Akumulasi Kehadiran Bulan Ini (November 2026)</text>
    
    <g transform="translate(520, 70)">
      <rect x="0" y="0" width="130" height="85" rx="8" fill="#e2f6d5" />
      <text x="15" y="28" fill="#163300" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Hadir Fisik</text>
      <text x="15" y="65" fill="#163300" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="28">22</text>

      <rect x="145" y="0" width="130" height="85" rx="8" fill="#e0f2fe" />
      <text x="160" y="28" fill="#075985" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Presensi PKL</text>
      <text x="160" y="65" fill="#0284c7" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="28">18</text>

      <rect x="290" y="0" width="130" height="85" rx="8" fill="#fef3c7" />
      <text x="305" y="28" fill="#92400e" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Izin / Sakit</text>
      <text x="305" y="65" fill="#b45309" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="28">1</text>

      <rect x="435" y="0" width="130" height="85" rx="8" fill="#fee2e2" />
      <text x="450" y="28" fill="#991b1b" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Alfa</text>
      <text x="450" y="65" fill="#b91c1c" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="28">0</text>
    </g>

    <text x="520" y="195" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Persentase Kehadiran Total: <tspan fill="#163300" font-weight="bold">97.8%</tspan> (Sangat Baik)</text>
    <rect x="520" y="210" width="570" height="12" rx="6" fill="#e8ebe6" />
    <rect x="520" y="210" width="557" height="12" rx="6" fill="#9fe870" stroke="#163300" stroke-width="0.5" />
  </g>

  <!-- PKL Action Banner (Forest & Lime) -->
  <g transform="translate(280, 375)">
    <rect x="0" y="0" width="1120" height="100" rx="12" fill="#163300" />
    <text x="35" y="42" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="18">📍 Anda Sedang Ditugaskan Praktik Kerja Lapangan (PKL)</text>
    <text x="35" y="68" fill="#9fe870" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Lokasi Penempatan: PT Telkom Akses Cirebon • Radius Toleransi Geofence: 50 Meter</text>
    <rect x="890" y="28" width="195" height="44" rx="22" fill="#9fe870" />
    <text x="987" y="55" fill="#163300" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="13" text-anchor="middle">Buka Presensi PKL →</text>
  </g>
</svg>