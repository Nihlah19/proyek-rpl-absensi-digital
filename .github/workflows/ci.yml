name: CI / Automated Testing Pipeline

on:
  push:
    branches: [ "main", "revisi_fitur_absensi_pkl" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: PHP Syntax Lint Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup PHP Environment
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, pdo, pdo_mysql, curl, gd

    - name: PHP Syntax Check (Linting)
      run: |
        find web/app web/public api -maxdepth 3 -name "*.php" -exec php -l {} \;
