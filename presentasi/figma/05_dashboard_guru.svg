<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <rect width="1440" height="900" fill="#f8fafc" />

  <!-- Sidebar -->
  <rect x="0" y="0" width="250" height="900" fill="#163300" />
  <circle cx="45" cy="40" r="18" fill="#9fe870" />
  <text x="45" y="46" fill="#163300" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="16" text-anchor="middle">NU</text>
  <text x="75" y="38" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13">PORTAL GURU</text>
  <text x="75" y="52" fill="#9fe870" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">SMK NU WARGABINANGUN</text>

  <g transform="translate(14, 85)" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">
    <rect x="0" y="0" width="222" height="40" rx="8" fill="#285804" />
    <text x="38" y="25" fill="#9fe870" font-weight="bold">📊 Dashboard Guru</text>

    <text x="38" y="65" fill="#d1d5db">📷 Presensi Barcode QR</text>
    <text x="38" y="105" fill="#d1d5db">📅 Jadwal Mengajar</text>
    <text x="38" y="145" fill="#d1d5db">📝 Catatan dari Kepsek</text>
    <text x="38" y="185" fill="#d1d5db">📋 Pengajuan Izin/Sakit</text>
    <text x="38" y="225" fill="#d1d5db">📈 Riwayat Kehadiran</text>
    <text x="38" y="265" fill="#d1d5db">👤 Profil Saya</text>
  </g>

  <!-- Top Navbar -->
  <rect x="250" y="0" width="1190" height="64" fill="#ffffff" />
  <line x1="250" y1="64" x2="1440" y2="64" stroke="#e2e8f0" stroke-width="1" />
  <text x="280" y="38" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="18">Portal Mandiri Guru &amp; Pengajar</text>

  <!-- Welcome Banner (Forest #163300) -->
  <g transform="translate(280, 85)">
    <rect x="0" y="0" width="1120" height="130" rx="12" fill="#163300" />
    <text x="35" y="45" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="22">Selamat Pagi, Bapak Ahmad Fauzi, S.Kom.</text>
    <text x="35" y="75" fill="#e2f6d5" font-family="'Plus Jakarta Sans', sans-serif" font-size="14">Status Hari Ini (08 Nov 2026): <tspan fill="#9fe870" font-weight="bold">HADIR TEPAT WAKTU (06:55 WIB)</tspan> via Barcode Scanner Lobby.</text>
    <text x="35" y="100" fill="#9fe870" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Jadwal mengajar aktif hari ini: 4 Jam Pelajaran di Ruang Lab RPL 2.</text>

    <rect x="890" y="38" width="190" height="50" rx="25" fill="#9fe870" />
    <text x="985" y="68" fill="#163300" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="13" text-anchor="middle">📷 Scan QR Masuk / Pulang</text>
  </g>

  <!-- Schedule & Supervisor Notes Cards -->
  <g transform="translate(280, 240)">
    <!-- Schedule Card -->
    <rect x="0" y="0" width="710" height="610" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
